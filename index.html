<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardboard Robot Controller</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
            --accent-orange: #f97316;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }

        header h1 {
            font-size: 1.3rem;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.1s ease, transform 0.1s ease;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .btn-red { background-color: var(--accent-red); }
        .btn-yellow { background-color: #eab308; color: #000; }
        .btn-green { background-color: var(--accent-green); }
        .btn-blue { background-color: #0284c7; }
        .btn-purple { background-color: var(--accent-purple); }
        .btn-orange { background-color: var(--accent-orange); }

        textarea {
            width: 100%;
            height: 90px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text-main);
            padding: 10px;
            font-size: 1rem;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        select, input[type="range"] {
            width: 100%;
            background-color: #0f172a;
            color: var(--text-main);
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px;
            font-size: 0.85rem;
        }

        .preset-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .preset-row button {
            padding: 8px;
            font-size: 0.8rem;
        }

        .quick-chips {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .chip {
            background-color: #334155;
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.75rem;
            white-space: nowrap;
            cursor: pointer;
            border: none;
        }

        .chip:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🤖 Robot Voice Controller</h1>
            <p>Connect Bluetooth speaker • Record, Soundboard, or Speak Live</p>
        </header>

        <!-- Voice Recorder Card -->
        <div class="card">
            <div class="card-title">🎙️ Quick Voice Recorder</div>
            <div class="btn-grid">
                <button class="btn-red" id="recordBtn" onclick="toggleRecording()">● Record Voice</button>
                <button class="btn-yellow" id="stopRecordBtn" onclick="stopRecording()" disabled>⏹ Stop & Add</button>
            </div>
            <div id="recordedList" style="display:flex; flex-direction:column; gap:6px; margin-top:4px;"></div>
        </div>

        <!-- Soundboard Card (Complete Robot Sound FX) -->
        <div class="card">
            <div class="card-title">
                🎵 Robot Soundboard & FX
                <button class="btn-yellow" style="padding: 4px 10px; font-size: 0.75rem;" onclick="stopAudio()">⏹ Stop Audio</button>
            </div>
            <div class="btn-grid">
                <button class="btn-blue" onclick="playRobotSound('beep')">⚡ Beep-Boop</button>
                <button class="btn-purple" onclick="playRobotSound('startup')">👋 Cute Startup</button>
                <button class="btn-orange" onclick="playRobotSound('processing')">⚙️ Processing Chime</button>
                <button class="btn-green" onclick="playRobotSound('success')">✨ Success Sound</button>
                <button class="btn-red" onclick="playRobotSound('error')">🚨 Error Alarm</button>
                <button class="btn-yellow" onclick="playRobotSound('warning')">⚠️ Warning Beep</button>
                <button class="btn-blue" onclick="playRobotSound('scan')">🔍 Radar Scan</button>
                <button class="btn-gray" style="background-color:#475569;" onclick="playRobotSound('shutdown')">🔌 Power Down</button>
            </div>
        </div>

        <!-- Live Type & Speak Card -->
        <div class="card">
            <div class="card-title">💬 Live Type & Speak</div>
            
            <div class="preset-row">
                <button class="btn-blue" onclick="applyVoicePreset('deepMale')">♂️ Male: Deep Robot</button>
                <button class="btn-blue" onclick="applyVoicePreset('friendlyMale')">♂️ Male: Friendly</button>
                <button class="btn-purple" onclick="applyVoicePreset('assistantFemale')">♀️ Female: AI Assistant</button>
                <button class="btn-purple" onclick="applyVoicePreset('cheerfulFemale')">♀️ Female: Cheerful</button>
            </div>

            <textarea id="speechText" placeholder="Type what you want the robot to say aloud...">Beep boop! Systems online and ready.</textarea>

            <div class="controls-row">
                <div class="control-group" style="flex: 2;">
                    <label for="voiceSelect">Device Voice:</label>
                    <select id="voiceSelect"></select>
                </div>
                <div class="control-group" style="flex: 1;">
                    <label for="pitchRange">Pitch: <span id="pitchVal">1.2</span></label>
                    <input type="range" id="pitchRange" min="0.5" max="2.0" step="0.1" value="1.2" oninput="updatePitchVal()">
                </div>
            </div>

            <button class="btn-green" style="font-size: 1rem; padding: 14px;" onclick="speakText()">🔊 Speak Through Robot</button>

            <div class="quick-chips">
                <button class="chip" onclick="quickSay('Beep boop!')">"Beep boop!"</button>
                <button class="chip" onclick="quickSay('Scanning area...')">"Scanning..."</button>
                <button class="chip" onclick="quickSay('Systems fully operational!')">"All systems go"</button>
                <button class="chip" onclick="quickSay('Error 404: Snack not found!')">"Snack error"</button>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API for synthetic robot sound effects & chimes
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playRobotSound(type) {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;

            if (type === 'beep') {
                // Classic Beep Boop
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.setValueAtTime(1040, now + 0.1);
                osc.frequency.setValueAtTime(650, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'startup') {
                // Cute ascending startup chime
                let notes = [440, 554, 659, 880];
                notes.forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.12, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.1);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.1);
                });
            } else if (type === 'processing') {
                // Processing computer whir / pulse
                for (let i = 0; i < 4; i++) {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200 + i * 50, now + (i * 0.1));
                    gain.gain.setValueAtTime(0.1, now + (i * 0.1));
                    gain.gain.exponentialRampToValueAtTime(0.01, now + (i * 0.1) + 0.08);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.1));
                    osc.stop(now + (i * 0.1) + 0.08);
                }
            } else if (type === 'success') {
                // Happy twin chime
                let notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, now + i * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.09 + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.09);
                    osc.stop(now + i * 0.09 + 0.15);
                });
            } else if (type === 'error') {
                // Error alarm buzzer
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'warning') {
                // Warning pulsing beep
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'scan') {
                // Sonar / Radar sweep chirp
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(900, now + 0.4);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.45);
            } else if (type === 'shutdown') {
                // Descending power down tone
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.6);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.65);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.65);
            }
        }

        function stopAudio() {
            window.speechSynthesis.cancel();
        }

        // Text to Speech Setup with Distinct Voice Matching
        let voices = [];
        const voiceSelect = document.getElementById('voiceSelect');
        const pitchRange = document.getElementById('pitchRange');
        const pitchVal = document.getElementById('pitchVal');

        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            voiceSelect.innerHTML = '';
            
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                if (voice.lang.includes('en') || voice.default) {
                    voiceSelect.appendChild(option);
                }
            });

            if (voiceSelect.children.length === 0) {
                voices.forEach((voice, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    voiceSelect.appendChild(option);
                });
            }
        }

        loadVoices();
        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function updatePitchVal() {
            pitchVal.textContent = pitchRange.value;
        }

        function applyVoicePreset(preset) {
            loadVoices();
            let targetGender = preset.includes('Female') ? 'female' : 'male';
            
            let selectedIndex = 0;
            for (let i = 0; i < voices.length; i++) {
                let name = voices[i].name.toLowerCase();
                if (targetGender === 'female' && (name.includes('female') || name.includes('zira') || name.includes('samantha') || name.includes('victoria') || name.includes('karen') || name.includes('google us english'))) {
                    selectedIndex = i;
                    break;
                } else if (targetGender === 'male' && (name.includes('male') || name.includes('david') || name.includes('george') || name.includes('daniel') || name.includes('alex') || name.includes('uk english male'))) {
                    selectedIndex = i;
                    break;
                }
            }

            voiceSelect.value = selectedIndex;

            if (preset === 'deepMale') pitchRange.value = '0.5';
            if (preset === 'friendlyMale') pitchRange.value = '0.9';
            if (preset === 'assistantFemale') pitchRange.value = '1.3';
            if (preset === 'cheerfulFemale') pitchRange.value = '1.7';
            
            updatePitchVal();
        }

        function speakText() {
            window.speechSynthesis.cancel();
            const text = document.getElementById('speechText').value;
            if (!text) return;

            const utterance = new SpeechSynthesisUtterance(text);
            const selectedVoiceIndex = voiceSelect.value;
            if (voices[selectedVoiceIndex]) {
                utterance.voice = voices[selectedVoiceIndex];
            }
            utterance.pitch = parseFloat(pitchRange.value);
            utterance.rate = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        function quickSay(phrase) {
            document.getElementById('speechText').value = phrase;
            speakText();
        }

        // Voice Recorder using MediaRecorder API
        let mediaRecorder;
        let audioChunks = [];

        async function toggleRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    const listContainer = document.getElementById('recordedList');
                    const clipName = prompt("Name your recorded sound clip:", "Custom Voice Line");
                    if (!clipName) return;

                    const itemDiv = document.createElement('div');
                    itemDiv.style.display = "flex";
                    itemDiv.style.alignItems = "center";
                    itemDiv.style.justifyContent = "space-between";
                    itemDiv.style.backgroundColor = "#0f172a";
                    itemDiv.style.padding = "8px";
                    itemDiv.style.borderRadius = "6px";
                    
                    const label = document.createElement('span');
                    label.textContent = clipName;
                    label.style.fontSize = "0.85rem";

                    const playBtn = document.createElement('button');
                    playBtn.textContent = "▶ Play";
                    playBtn.className = "btn-green";
                    playBtn.style.padding = "6px 12px";
                    playBtn.style.fontSize = "0.8rem";

                    const audioElement = new Audio(audioUrl);
                    playBtn.onclick = () => audioElement.play();

                    itemDiv.appendChild(label);
                    itemDiv.appendChild(playBtn);
                    listContainer.appendChild(itemDiv);
                };

                mediaRecorder.start();
                document.getElementById('recordBtn').disabled = true;
                document.getElementById('recordBtn').style.opacity = "0.5";
                document.getElementById('stopRecordBtn').disabled = false;
            } catch (err) {
                alert("Microphone access blocked or not supported on this browser.");
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                document.getElementById('recordBtn').disabled = false;
                document.getElementById('recordBtn').style.opacity = "1";
                document.getElementById('stopRecordBtn').disabled = true;
            }
        }
    </script>
</body>
</html>
